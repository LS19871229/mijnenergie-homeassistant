# Draait bij elke wijziging: Home Assistant-controle (hassfest), HACS-controle en de tests.
name: Controle

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # elke maandag: vangt breuk door nieuwe Home Assistant-versies

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q
